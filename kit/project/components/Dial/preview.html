<!-- @dsCard group="Controls" height=230 subtitle="live.dial. Unipolar, bipolar with notch, at zero, at 100 %." -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><style>body{margin:0;padding:16px;background:var(--outer);font-family:var(--font-live)}.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}</style></head>
<body>
<div class="row" id="r"></div>
<script>
(function(){
var r=document.getElementById('r');
function dev(o){var c=document.createElement('div');r.appendChild(c);var d=LiveKit.device(c,o);if(o.caption){var p=document.createElement('div');p.className='lk-cap';p.textContent=o.caption;c.appendChild(p);}return d;}
var d=dev({w:227});d.titleName('Dial');
d.dial({cx:30.5,cap:120,label:'Drive',value:'6.0 dB',v:.42});
d.dial({cx:82.5,cap:114,label:'Gain',value:'+3.0 dB',v:.66,bipolar:true,notch:true});
d.dial({cx:134.5,cap:114,label:'Pan',value:'C',v:.5,bipolar:true,notch:true});
d.dial({cx:196.5,cap:120,label:'Dry/Wet',value:'100 %',v:1});
d.dial({cx:30.5,cap:8,label:'Freq',value:'20.0 Hz',v:0});
d.dial({cx:82.5,cap:8,label:'Amount',value:'40 %',v:.4,color:'orange'});
})();
</script>
</body>
</html>
